<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decohere</title>
    <style type="text/css">
        :root {
            color-scheme: light dark;
            --base-color: oklch(89.271% 0.18381 96.618);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        main {
            margin: 19.1%;
        }

        h1 {
            font-size: 3rem;
            color: var(--base-color);
            text-transform: uppercase;
            margin-bottom: 1.91rem;
        }

        p {
            font-weight: 600;
            margin-bottom: 1.91rem;
        }
    </style>
    <script>
        // GitHub Pages serves this page for any path without a file. Requests under
        // /revision/ that don't exist exactly are sent to the newest revision at or
        // below the one asked for: /revision/1 -> newest 1.x.x, /revision/2/0/9 -> newest
        // revision <= 2.0.9. Known revisions are read from the list at /revision/.
        (function () {
            var match = location.pathname.match(/^\/revision\/(\d+)(?:\/(\d+))?(?:\/(\d+))?\/?$/);
            if (!match) return;

            var wanted = [1, 2, 3].map(function (i) {
                return match[i] === undefined ? Infinity : Number(match[i]);
            });

            function compare(a, b) {
                for (var i = 0; i < 3; i++) {
                    if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
                }
                return 0;
            }

            document.documentElement.dataset.resolving = "";

            fetch("/revision/")
                .then(function (response) { return response.text(); })
                .then(function (html) {
                    var doc = new DOMParser().parseFromString(html, "text/html");
                    var best = Array.prototype.slice.call(doc.querySelectorAll("[data-version]"))
                        .map(function (el) { return el.dataset.version.split(".").map(Number); })
                        .filter(function (v) { return compare(v, wanted) <= 0; })
                        .sort(compare)
                        .pop();

                    var target = best ? "/revision/" + best.join("/") + "/" : "/revision/";
                    if (target.replace(/\/$/, "") === location.pathname.replace(/\/$/, "")) {
                        target = "/revision/";
                    }
                    location.replace(target);
                })
                .catch(function () { location.replace("/revision/"); });
        })();
    </script>
    <style type="text/css">
        html[data-resolving] main {
            visibility: hidden;
        }
    </style>
</head>

<body>
    <main>
        <h1>Not found</h1>
        <p>There's nothing at this address.</p>
        <p><a href="/">Back to Decohere</a> &middot; <a href="/revision/">Revisions</a></p>
    </main>
</body>

</html>
